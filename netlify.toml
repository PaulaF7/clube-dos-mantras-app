# Este cabeçalho aplica-se a TODOS os ficheiros
[[headers]]
  for = "/*"
  [headers.values]
    # Pede ao navegador para verificar se o ficheiro está atualizado (revalidar)
    Cache-Control = "public, max-age=0, must-revalidate"

# Este cabeçalho SOBRESCREVE a regra acima para os ficheiros imutáveis (JS, CSS, etc.)
[[headers]]
  # O Netlify gera ficheiros com um hash único, ex: main.a1b2c3d4.js
  # Estes ficheiros são considerados imutáveis
  for = "/static/*"
  [headers.values]
    # Diz ao navegador para guardar estes ficheiros por 1 ano sem perguntar novamente
    Cache-Control = "public, max-age=31536000, immutable"